name: Build and Push Docker Image and Update Tags Pipeline

on:
  workflow_run:
    workflows: ["Lint and Build Pipeline"]
    types: [completed]

jobs:
  ignore-check:
    runs-on: ubuntu-latest
    outputs:
      build_matrix: ${{ steps.check.outputs.build_matrix }}
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Run the script
        id: check
        run: |
          apps=($(ls apps))
          to_build=()
          for app in "$(apps[@])"; do
              echo "Checking if '$app' can be ignored..."
              set +e
              npx turbo-ignore "$app"
              code=$?
              set -e
              echo "Exit code for '$app': $code"
              if [ "$code" -ne 0 ]; then
                  to_build+=("$app")
              fi
          done
          echo "App to build: ${to_build[@]}"
          build_matrix=$(printf '%s\n' "${to_build[@]}" | jq -R . | jq -cs .)
          echo "build_matrix=$build_matrix" >> "$GITHUB_OUTPUT"

  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: ignore-check
    strategy:
      matrix:
        app: ${{ fromJson(needs.ignore-check.outputs.build_matrix) }}
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Prune the codebase for ${{ matrix.app }}
        run: npx turbo prune ${{ matrix.app }} --docker

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push the Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile.${{ matrix.app }}
          build-args: |
            TURBO_TOKEN=${{ secrets.TURBO_TOKEN}}
            TURBO_TEAM=${{ vars.TURBO_TEAM }}
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/deploysphere-${{ matrix.app }}:${{ github.sha }}
  
  update-tags:
    runs-on: ubuntu-latest
    needs: 
      - ignore-check
      - build-and-push
    steps:
        - name: Clone Gitops repo, update, and push
          env:
            PAT: ${{ secrets.PAT }}
          run: |
            git clone https://github.com/Krishil-Jayswal/Gitops.git
            cd Gitops
            git config user.name "GitHub Actions Bot"
            git config user.email "actions@github.com"
            echo '${{ needs.ignore-check.outputs.build_matrix }}' | jq -r '.[]' | while read -r app_name; do
              sed -i "s|image:${{ secrets.DOCKERHUB_USERNAME }}/deploysphere-${app_name}:.*|image:${{ secrets.DOCKERHUB_USERNAME }}/deploysphere-${app_name}:${{ github.sha }}|" "deploysphere/apps/${app_name}.yml"
              git add "deploysphere/${app_name}-deployment.yml"
              git commit -m "Update deploysphere-${app_name} image to ${{ github.sha }}"
            done
            git push https://${PAT}@github.com/Krishil-Jayswal/Gitops.git main
